# Multi-Agent Test Platform Scenarios File
# Define your test prompts here. They will be executed sequentially.

scenarios:
  - name: "MSN-001: Homepage Load Verification"
    prompt: >
      Navigate to https://www.msn.com/en-in,
      Verify MSN homepage loads successfully,
      Take a screenshot to document the page state.
      Verify that page title is displayed correctly (contains 'MSN'),
      Verify that main homepage sections are visible,
      Verify that news articles or feed loads,
      Verify that standard content modules load,
      Verify that the page becomes interactive,
      Verify that images display correctly,
      Verify that navigation icons are visible,
